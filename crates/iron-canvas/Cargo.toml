[package]
name = "iron-canvas"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
iron-canvas-core = { version = "0.1.0-beta.2", path = "../iron-canvas-core", default-features = false }
iron-canvas-ironcalc = { version = "0.1.0-beta.2", path = "../iron-canvas-ironcalc", default-features = false }
ironcalc_base.workspace = true

[dev-dependencies]
iron-canvas-export = { path = "../iron-canvas-export" }
ironcalc_base.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iron-canvas-native = { path = "../iron-canvas-native" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
iron-canvas-canvas2d = { path = "../iron-canvas-canvas2d" }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "TextMetrics",
    "ImageData",
] }
ironcalc = { workspace = true }
