[workspace]
members = ["crates/*", "bindings/wasm", "examples/react/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.2"
authors = ["CoalUnicorn"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ironcalc_base = { version = "0.8.3", git = "https://github.com/CoalUnicorn/IronCalc", rev = "7e6ae21c0f163cacf56b9d47acf777454bfaa243" }
ironcalc = { version = "0.8.3", git = "https://github.com/CoalUnicorn/IronCalc", rev = "7e6ae21c0f163cacf56b9d47acf777454bfaa243" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25.1"
base64 = "0.22"

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
