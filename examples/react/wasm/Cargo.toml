[package]
name = "iron-canvas-react-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iron-canvas = { path = "../../../crates/iron-canvas" }
iron-canvas-canvas2d = { path = "../../../crates/iron-canvas-canvas2d" }
iron-canvas-core = { path = "../../../crates/iron-canvas-core" }
iron-canvas-ironcalc = { path = "../../../crates/iron-canvas-ironcalc" }
ironcalc_base = { version = "0.8.3", git = "https://github.com/CoalUnicorn/IronCalc", rev = "93f3407f822df5925d8b65a23248fd40155579e9" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[workspace]
resolver = "3"
