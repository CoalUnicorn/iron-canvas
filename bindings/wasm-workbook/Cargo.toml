[package]
name = "iron-canvas-wasm-workbook"
version = "0.1.0-beta.2"
authors = ["CoalUnicorn"]
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
ironcalc = { workspace = true }
ironcalc_base = { workspace = true }
iron-canvas = { path = "../../crates/iron-canvas" }
iron-canvas-core = { path = "../../crates/iron-canvas-core" }
iron-canvas-ironcalc = { path = "../../crates/iron-canvas-ironcalc" }
iron-canvas-navigation = { path = "../../crates/iron-canvas-navigation" }
iron-canvas-wasm = { path = "../wasm", default-features = false }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.70"

