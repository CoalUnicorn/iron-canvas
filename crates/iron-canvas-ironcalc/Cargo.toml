[package]
name = "iron-canvas-ironcalc"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["legacy"]
legacy = ["iron-canvas-core/legacy"]

[dependencies]
iron-canvas-core = { version = "0.1.0-beta.2", path = "../iron-canvas-core", default-features = false }
ironcalc_base = { workspace = true }

[dev-dependencies]
# Engine-backed conditional-formatting verification: load the same workbooks
# the audit used and assert the adapter's evaluated decorations.
ironcalc = { workspace = true }
iron-canvas-export = { path = "../iron-canvas-export" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iron-canvas-native = { path = "../iron-canvas-native" }
