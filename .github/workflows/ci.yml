name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new pull request update replaces its old run. Keep each push run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check format
        run: cargo +stable fmt --all -- --check

  native:
    name: Native Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check lints
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run native tests
        run: cargo +stable test --workspace --all-targets --all-features --locked
      # --all-targets excludes documentation tests. Run them explicitly.
      - name: Run documentation tests
        run: cargo +stable test --workspace --doc --all-features --locked
      - name: Check API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked
      - name: Check export feature combinations
        shell: bash
        run: |
          # Separate commands prevent one export feature from hiding a missing dependency.
          for features in '' svg pdf; do
            cargo +stable clippy -p iron-canvas-export --all-targets --no-default-features --features "$features" --locked -- -D warnings
            cargo +stable test -p iron-canvas-export --no-default-features --features "$features" --locked
          done

  browser:
    name: Wasm and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust Wasm target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check Wasm workspace
        run: cargo +stable check --workspace --target wasm32-unknown-unknown --locked
      - name: Install matching browser test runner
        shell: bash
        run: |
          # The runner and the Wasm code use the same wasm-bindgen version.
          version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version"
          cargo +stable install wasm-bindgen-cli --version "$version" --locked
      - name: Run Canvas2D tests in Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo +stable test -p iron-canvas --target wasm32-unknown-unknown --test cf_fixture_canvas2d --locked
