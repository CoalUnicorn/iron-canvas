[package]
name = "iron-canvas-ironcalc"
version.workspace = true
authors.workspace = true
edition.workspace = true
# The cell-block evidence files use private compiler state. compiler.rs loads
# them as unit-test modules. List integration tests to avoid a second build of
# those files as standalone test crates.
autotests = false

[lib]
crate-type = ["rlib"]

[dependencies]
iron-canvas-core = { version = "0.1.0-beta.2", path = "../iron-canvas-core" }
ironcalc_base = { workspace = true }

[dev-dependencies]
# Engine-backed conditional-formatting verification: load the same workbooks
# the audit used and assert the adapter's evaluated decorations.
ironcalc = { workspace = true }
iron-canvas-export = { path = "../iron-canvas-export" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
iron-canvas-native = { path = "../iron-canvas-native" }

[lints]
workspace = true

[[test]]
name = "cf_fixture"
path = "tests/cf_fixture.rs"

[[test]]
name = "cf_round_trip"
path = "tests/cf_round_trip.rs"

[[test]]
name = "compiler"
path = "tests/compiler.rs"

[[test]]
name = "text_metrics"
path = "tests/text_metrics.rs"

[[test]]
name = "text_spill"
path = "tests/text_spill.rs"
