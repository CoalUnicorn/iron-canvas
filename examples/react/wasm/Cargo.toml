[package]
name = "iron-canvas-react-example"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
iron-canvas = { path = "../../../crates/iron-canvas" }
iron-canvas-canvas2d = { path = "../../../crates/iron-canvas-canvas2d" }
iron-canvas-core = { path = "../../../crates/iron-canvas-core" }
iron-canvas-ironcalc = { path = "../../../crates/iron-canvas-ironcalc" }
iron-canvas-wasm = { path = "../../../bindings/wasm" }
ironcalc.workspace = true
ironcalc_base.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement"] }
